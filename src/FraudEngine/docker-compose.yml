services:
  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_URL: "http://localhost:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  fraud-engine-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fraud_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123
    volumes:
      - fraud-engine-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  fraud-engine-api:
    build:
      context: .
      dockerfile: FE.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__FraudEngine: "Host=fraud-engine-db;Database=fraud_engine;Username=postgres;Password=Password123"
      Keycloak__Authority: "http://localhost:8080/realms/fraud-engine"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/fraud-engine/.well-known/openid-configuration"
      Keycloak__RequireHttpsMetadata: "false"
    depends_on:
      fraud-engine-db:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  keycloak-db-data:
  fraud-engine-db-data:
